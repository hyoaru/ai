<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1124 501" width="1124" role="img" aria-labelledby="d07-title">
  <title id="d07-title">One command, every agent</title>
  <desc>The install command feeds the skills CLI, which fans out to five agent skill directories; Claude Code receives a symlink.</desc>
  <style>
    text { font-family: system-ui, sans-serif; }
  </style>
  <defs>
    <!-- Single accent: every edge in this figure is the one install flow. -->
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1124" height="501" fill="#ffffff"/>

  <!-- Widths, all-Latin labels at 0.58 x font-size per character:
         command      44 chars x 7.25 = 319   -> 360 box
         longest note 45 chars x 6.0  = 270   -> 305 box
       The three boxes on the middle line (command, CLI, .pi) stay within 60px of each
       other in size, so the CLI box and the surfaces follow the command box up to 305:
       360 - 305 = 55. All five surfaces share that width and a 56 height (12.5 x 3 +
       18.75) so the fan is symmetric about its middle branch; the command box alone is
       38 (12.5 x 3), one line with no secondary line. -->

  <!-- Title x is the centre of the drawn content (25..1099 -> 562). Baseline 40;
       subtitle = title + 24. First card ink at y=84, 16.9px below the subtitle ink. -->
  <text x="562" y="40" font-size="24" font-weight="650" fill="#0f172a" text-anchor="middle">One command, every agent</text>
  <text x="562" y="64" font-size="12.5" fill="#64748b" text-anchor="middle">Measured 2026-08-28: the CLI recognises 77 agents; Claude Code gets a symlink</text>

  <!-- Connectors, painted under the cards. Start = source edge + 5, end = target edge - 11
       (refX="2" puts the tip 6px past the end of the line). The CLI box and the middle
       surface sit 28px apart, so the outer branches leave the CLI's top and bottom edges
       (5px clear) at two x positions, graduated so the four arcs never touch. Each is a
       single C whose second control point is level with its end point and to its left,
       which keeps every arrowhead pointing right. -->
  <path d="M390,280 L 402,280" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M723,280 L 735,280" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M668,247 C 668,179 713,112 783,112" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M688,247 C 688,212 708,196 759,196" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M668,313 C 668,381 713,448 783,448" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M688,313 C 688,378 708,364 759,364" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <!-- The command. One line: height = 12.5 x 3 = 38; baseline = 261 + 19 + 12.5 x 0.35.
       Emphasised card: border-strong. -->
  <rect x="25" y="261" width="360" height="38" rx="6" fill="#ffffff" stroke="#c3ccd8"/>
  <text x="205" y="284.38" font-size="12.5" fill="#0f172a" text-anchor="middle">npx skills add bybit-exchange/svg-diagram -g</text>

  <!-- Two lines: height = 12.5 x 3 + 18.75 = 56.25 -> 56. Baselines 275 / 293.75, an
       18.75px line height for the 12.5px line. -->
  <rect x="413" y="252" width="305" height="56" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="565.5" y="275" font-size="12.5" fill="#0f172a" text-anchor="middle">skills CLI</text>
  <text x="565.5" y="293.75" font-size="11" fill="#64748b" text-anchor="middle">77 agents</text>

  <!-- The five install surfaces, 28px apart vertically. Left edges step 794 / 770 / 746 /
       770 / 794: the middle one is nearest the CLI box, and each outer one stands further
       right, which keeps the vertical gaps inside 25-30px and leaves the outer arcs room
       to climb without passing within 20px of a surface they are not connected to. -->
  <rect x="794" y="84" width="305" height="56" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="946.5" y="107" font-size="12.5" fill="#0f172a" text-anchor="middle">.agents/skills/</text>
  <text x="946.5" y="125.75" font-size="11" fill="#64748b" text-anchor="middle">Generic (Codex / Cursor / Copilot / opencode)</text>
  <rect x="770" y="168" width="305" height="56" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="922.5" y="191" font-size="12.5" fill="#0f172a" text-anchor="middle">.claude/skills/</text>
  <text x="922.5" y="209.75" font-size="11" fill="#64748b" text-anchor="middle">Symlink</text>
  <rect x="746" y="252" width="305" height="56" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="898.5" y="284.38" font-size="12.5" fill="#0f172a" text-anchor="middle">.pi/skills/</text>
  <rect x="770" y="336" width="305" height="56" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="922.5" y="368.38" font-size="12.5" fill="#0f172a" text-anchor="middle">.openhands/skills/</text>
  <rect x="794" y="420" width="305" height="56" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="946.5" y="452.38" font-size="12.5" fill="#0f172a" text-anchor="middle">.windsurf/skills/</text>
</svg>
