<svg width="494" height="504" viewBox="0 0 494 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d06-title">
  <title id="d06-title">What's in this repository</title>
  <desc>Repository layout: the root holds a column of tracked entries, a nested tools/svg-lint panel with three members, the gallery card and two more files. The linter gates the gallery, drawn as the one accent arrow.</desc>
  <style>
    text { font-family: system-ui, sans-serif; }
  </style>
  <defs>
    <!-- Accent arrow: the gates edge is the one story-carrying link in this diagram -->
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="494" height="504" fill="#ffffff"/>

  <text x="247" y="40" font-size="24" font-weight="650" fill="#0f172a" text-anchor="middle">What's in this repository</text>

  <!-- Repository root: panel #eef1f5, hairline #dbe1e8, radius 10, 20px side padding, 30px below the last card.
       The gallery card sits under the linter panel so the gates arrow runs vertically and its
       label gets a full 15px channel; the sibling gap to the left column stays at 30px.
       Root: x=20 y=64 w=454 h=415, right 474, bottom 479. -->
  <rect x="20" y="64" width="454" height="415" rx="10" fill="#eef1f5" stroke="#dbe1e8"/>
  <!-- Zone title: 10px, 600, tracked, muted, left-aligned to the inner card column x=40 -->
  <text x="40" y="82" font-size="10" font-weight="600" letter-spacing="0.5" fill="#94a3b8">bybit-exchange/svg-diagram</text>

  <!-- Tracked entries. Cards white, border #d8dee6, 38 tall (12.5x3), 25px rhythm.
       Baseline = y + 19 + 12.5x0.35. -->
  <rect x="40" y="96" width="192" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="136" y="119.4" font-size="12.5" fill="#0f172a" text-anchor="middle">SKILL.md</text>
  <rect x="40" y="159" width="192" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="136" y="182.4" font-size="12.5" fill="#0f172a" text-anchor="middle">README.md</text>
  <rect x="40" y="222" width="192" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="136" y="245.4" font-size="12.5" fill="#0f172a" text-anchor="middle">assets/</text>
  <rect x="40" y="285" width="192" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="136" y="308.4" font-size="12.5" fill="#0f172a" text-anchor="middle">package.json</text>

  <!-- The one directory whose members are drawn: nested panel #f1f4f8, same border, radius, title style.
       x=262 y=96 w=192 h=227, right 454, bottom 323, members at x=282 w=152, 25px rhythm. -->
  <rect x="262" y="96" width="192" height="227" rx="10" fill="#f1f4f8" stroke="#dbe1e8"/>
  <text x="282" y="114" font-size="10" font-weight="600" letter-spacing="0.5" fill="#94a3b8">tools/svg-lint/</text>
  <rect x="282" y="129" width="152" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="358" y="152.4" font-size="12.5" fill="#0f172a" text-anchor="middle">bin/svg-lint.mjs</text>
  <rect x="282" y="192" width="152" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="358" y="215.4" font-size="12.5" fill="#0f172a" text-anchor="middle">lib/</text>
  <rect x="282" y="255" width="152" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="358" y="278.4" font-size="12.5" fill="#0f172a" text-anchor="middle">test/</text>

  <!-- gallery/ below the linter panel: 25px below it, same column, card bottom 386. -->
  <rect x="262" y="348" width="192" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="358" y="371.4" font-size="12.5" fill="#0f172a" text-anchor="middle">gallery/ (10 diagrams)</text>

  <!-- Last two root entries across the inner width: 40..234 and 260..454, 26px apart. -->
  <rect x="40" y="411" width="194" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="137" y="434.4" font-size="12.5" fill="#0f172a" text-anchor="middle">LICENSE</text>
  <rect x="260" y="411" width="194" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="357" y="434.4" font-size="12.5" fill="#0f172a" text-anchor="middle">.gitignore</text>

  <!-- The linter as a whole gates the gallery: the line leaves the panel's own bottom wall at its
       centre x=358, start 323+5, end 348-11, tip 5px short of the card. -->
  <path d="M358,328 L 358,337" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <!-- Vertical-edge label: 15px right of the line, optically centred on the 328..337 run -->
  <text x="373" y="336" font-size="10" font-weight="600" letter-spacing="0.5" fill="#94a3b8">GATES</text>
</svg>
