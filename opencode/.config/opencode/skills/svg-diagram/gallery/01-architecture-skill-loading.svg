<svg width="670" viewBox="0 0 670 364.5" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d-title">
  <title id="d-title">How an agent loads a skill</title>
  <desc>Agent session indexes skill descriptions from two disk directories at startup; when a request matches, the SKILL.md body loads into context.</desc>
  <style>
    text { font-family: system-ui, sans-serif; }
  </style>
  <defs>
    <!-- Structural connector marker: hairline token -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#94a3b8"/>
    </marker>
    <!-- Accent marker: the one data-flow story, body loading on match -->
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#1d4ed8"/>
    </marker>
    <!-- Failure marker: unused in this diagram, defined for house consistency -->
    <marker id="arrow-fail" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Ground -->
  <rect x="0" y="0" width="670" height="364.5" fill="#ffffff"/>

  <!-- Title block: content centre x=335, title baseline 40, subtitle title+24 -->
  <text x="335" y="40" font-size="24" font-weight="650" fill="#0f172a" text-anchor="middle">How an agent loads a skill</text>
  <text x="335" y="64" font-size="12.5" fill="#64748b" text-anchor="middle">Descriptions index at startup; the body loads on match</text>

  <!-- Zone panels: 220 wide (20px side padding around 180px cards), 28px channel.
       Title zone 34px, rows 38px at 27px gaps, 30px below the last card. -->
  <rect x="22" y="88" width="220" height="232" rx="10" fill="#eef1f5" stroke="#dbe1e8"/>
  <text x="42" y="108" font-size="10" font-weight="600" letter-spacing="0.5" fill="#94a3b8">AGENT SESSION</text>
  <rect x="270" y="88" width="220" height="232" rx="10" fill="#eef1f5" stroke="#dbe1e8"/>
  <text x="290" y="108" font-size="10" font-weight="600" letter-spacing="0.5" fill="#94a3b8">DISK</text>

  <!-- Connectors: start = source edge + 5, line ends 11 short of the target so the
       painted tip stops 5px out. Category colour is gone: the disk reads are
       structural hairlines, the body load is the single accent story. -->
  <path d="M132,165 L 132,176" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Descriptions converge on the index: upper directory curves down, lower is level.
       cp1 stays in the 28px channel; cp2 is level with the end and right of it, so the
       head lands pointing left at the index card. -->
  <path d="M285,141 C 265,141 253,206 233,206" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M285,206 L 233,206" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- The match story: body out of the disk, into the session's context -->
  <path d="M285,271 L 233,271" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M475,271 L 507,271" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <!-- Session cards. Baselines: box y + height/2 + 12.5 x 0.35 -->
  <rect x="42" y="122" width="180" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="132" y="145.4" font-size="12.5" fill="#0f172a" text-anchor="middle">Session start</text>
  <rect x="42" y="187" width="180" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="132" y="210.4" font-size="12.5" fill="#0f172a" text-anchor="middle">Skill index</text>
  <rect x="42" y="252" width="180" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="132" y="275.4" font-size="12.5" fill="#0f172a" text-anchor="middle">Request matches</text>

  <!-- Disk cards, rows aligned with the session rows -->
  <rect x="290" y="122" width="180" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="380" y="145.4" font-size="12.5" fill="#0f172a" text-anchor="middle">~/.claude/skills/</text>
  <rect x="290" y="187" width="180" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="380" y="210.4" font-size="12.5" fill="#0f172a" text-anchor="middle">.agents/skills/</text>
  <rect x="290" y="252" width="180" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="380" y="275.4" font-size="12.5" fill="#0f172a" text-anchor="middle">SKILL.md body</text>

  <!-- Destination, outside both zones; the outcome of the accent story, so a
       border-strong card. Two 12.5px lines 19px apart, block centred on 268.5. -->
  <rect x="518" y="240" width="130" height="57" rx="6" fill="#ffffff" stroke="#c3ccd8"/>
  <text x="583" y="263.4" font-size="12.5" fill="#0f172a" text-anchor="middle">Body loaded</text>
  <text x="583" y="282.4" font-size="12.5" fill="#0f172a" text-anchor="middle">into context</text>

  <!-- Edge labels: each sits in a row band between two cards, clear of every wall
       and connector by 10px or more -->
  <text x="147" y="175" font-size="10" fill="#64748b">at startup</text>
  <text x="380" y="175" font-size="10" fill="#64748b" text-anchor="middle">descriptions only</text>
  <text x="380" y="240" font-size="10" fill="#64748b" text-anchor="middle">on match</text>

  <!-- Connector key, formerly a colour legend; the swatches are gone, the words stay -->
  <text x="335" y="337" font-size="10" fill="#64748b" text-anchor="middle">agent session · disk, descriptions at startup · body loaded on match</text>
</svg>
