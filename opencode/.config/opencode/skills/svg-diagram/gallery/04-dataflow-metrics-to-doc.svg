<svg width="834" height="203" viewBox="0 0 834 203" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d04-title">
  <title id="d04-title">From data interface to document figure</title>
  <desc>Six stages left to right: MCP interface, validation, aggregation, svg_escape, chart SVG, markdown doc. A red callout above warns that a team name containing &amp; breaks XML parsing; its arrow points at the svg_escape card.</desc>
  <style>
    text { font-family: system-ui, sans-serif; }
  </style>
  <defs>
    <!-- Accent arrow: the one data-flow edge colour in this diagram -->
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#1d4ed8"/>
    </marker>
    <!-- Failure arrow: the warning path into svg_escape() only -->
    <marker id="arrow-fail" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Width arithmetic, 12.5px body text: Latin 7.25px/char; box = label + 2x13 padding.
       MCP interface 13 = 94.25 -> 120 | Validation 10 = 72.5 -> 100 | Aggregation 11 = 79.75 -> 106
       svg_escape() 12 = 87 -> 116 | Chart SVG 9 = 65.25 -> 92 | Markdown doc 12 = 87 -> 116
       Row 650 across five 28px gaps = 790, content x=22..812, centre 417. -->
  <rect x="0" y="0" width="834" height="203" fill="#ffffff"/>

  <!-- Title block: baseline 40 and 64 (title+24); content ink starts 17px below the subtitle -->
  <text x="417" y="40" font-size="24" font-weight="650" fill="#0f172a" text-anchor="middle">From data interface to document figure</text>
  <text x="417" y="64" font-size="12.5" fill="#64748b" text-anchor="middle">Schema and source flow with the data — change either and the figure must be redrawn</text>

  <!-- Failure callout over step 4, centred on its x=490. 10px text -> height 30, baseline y+15+10x0.35.
       The ampersand is written &amp;: a bare & would break the parse this label warns about. -->
  <rect x="385" y="84" width="210" height="30" rx="6" fill="#ffffff" stroke="#dc2626"/>
  <text x="490" y="102.5" font-size="10" fill="#dc2626" text-anchor="middle">Team name with &amp; → XML parse fails</text>
  <!-- Callout bottom 114 + 5 -> card top 140 - 11; dashed because it is a failure path -->
  <path d="M490,119 L 490,129" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-fail)"/>

  <!-- Main flow, the one story-carrying line: accent from end to end.
       Row centre y = 140 + 38/2 = 159. start = source right + 5, end = target left - 11. -->
  <path d="M147,159 L 159,159" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M275,159 L 287,159" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M409,159 L 421,159" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M553,159 L 565,159" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M673,159 L 685,159" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <!-- Cards: white, 1px border, baseline = 140 + 19 + 12.5x0.35 = 163.4 -->
  <rect x="22" y="140" width="120" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="82" y="163.4" font-size="12.5" fill="#0f172a" text-anchor="middle">MCP interface</text>
  <rect x="170" y="140" width="100" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="220" y="163.4" font-size="12.5" fill="#0f172a" text-anchor="middle">Validation</text>
  <rect x="298" y="140" width="106" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="351" y="163.4" font-size="12.5" fill="#0f172a" text-anchor="middle">Aggregation</text>
  <rect x="432" y="140" width="116" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="490" y="163.4" font-size="12.5" fill="#0f172a" text-anchor="middle">svg_escape()</text>
  <rect x="576" y="140" width="92" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="622" y="163.4" font-size="12.5" fill="#0f172a" text-anchor="middle">Chart SVG</text>
  <rect x="696" y="140" width="116" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="754" y="163.4" font-size="12.5" fill="#0f172a" text-anchor="middle">Markdown doc</text>
</svg>
