<svg viewBox="-2 0 530 599" width="530" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d10-title">
  <title id="d10-title">A/B benchmark with a model as judge</title>
  <desc>For each test case, both a fixed baseline model and the router under test answer; results are recorded; a blind pairwise judge compares the answers in random order; the loop repeats for the next case; a report is generated afterwards.</desc>
  <style>
    text { font-family: system-ui, sans-serif; }
  </style>
  <defs>
    <!-- Structural arrow: hairline token. markerUnits="userSpaceOnUse" is mandatory. -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#94a3b8"/>
    </marker>
    <!-- Accent arrow: the one story-carrying flow, the measured answers reaching the judge. -->
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- Ground: white canvas behind everything -->
  <rect x="-2" y="0" width="530" height="599" fill="#ffffff"/>

  <!-- Column and row arithmetic, decided before any coordinate was written.
       Pair cards are 200 wide each ("Call the router under test" measures 26 x 7.25 = 188.5)
       on a 228px pitch; the loop panel adds 20px side padding, so it spans x 36..504 and
       its centre column is x 270. Record and judge cards are 240 wide; Next case 100;
       report 180; load 140. All gaps inside the panel are 28px; panel walls keep 30px to
       the load and report cards.
       The loop-back channel runs at x=22, 14px left of the panel wall, and the east arm
       is the thinnest tangent in the set: cp2.x (22) must stay below end.x (25).
       viewBox: content runs x 19.4 (title glyph left) .. 506.6 and y 22 .. 574, so 21.4px
       left and right and 22px top / 25px bottom: -2 0 530 599. -->

  <!-- Title centred on the content centre 263, not the panel centre 270: the loop-back
       channel reaches x=22 and is part of the content bounds. Baseline 40 = 22px top
       margin + 24 x 0.75; subtitle = title + 24. -->
  <text x="263" y="40" font-size="24" font-weight="650" fill="#0f172a" text-anchor="middle">A/B benchmark with a model as judge</text>
  <text x="263" y="64" font-size="12.5" fill="#64748b" text-anchor="middle">each case runs both variants; a blind judge compares the answers</text>

  <!-- Layer 1: the grouping panel, painted first so nothing it holds is covered.
       Height 354 = 36px label band + 56 + 26 + 56 + 28 + 56 + 28 + 38 + 30px bottom pad.
       Label left-aligned to the inner card column (x 56), baseline panel top + 20. -->
  <rect x="36" y="152" width="468" height="354" rx="12" fill="#eef1f5" stroke="#dbe1e8"/>
  <text x="56" y="172" font-size="10" font-weight="600" letter-spacing="0.5" fill="#94a3b8">FOR EACH TEST CASE</text>

  <!-- Layer 2: ordinary connectors. start = source edge + 5, end = target edge - 11, so
       the 6px tip stops 5px short of the target. Hairline: loop entry, advance, exit.
       Accent: the two answers and the record flowing into the judge. -->
  <path d="M270,127 L 270,141" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M156,249 L 156,259" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M384,249 L 384,259" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M270,331 L 270,343" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M270,415 L 270,427" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- The loop exit leaves the panel's own bottom wall rather than any one step:
       506 + 5 = 511 to 536 - 11 = 525. -->
  <path d="M270,511 L 270,525" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 3: cards. White fill, 1px border, radius 6. Baselines: single-line cards at
       box top + 23.4 (centre + 12.5 x 0.35); two-line pairs at top + 22 / + 42.
       A and B are peers: identical 200x54 cards, told apart by wording alone. -->
  <rect x="200" y="84" width="140" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="270" y="107.4" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Load test cases</text>

  <rect x="56" y="188" width="200" height="56" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="156" y="210" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Call the baseline</text>
  <text x="156" y="230" font-size="11" fill="#64748b" text-anchor="middle">a fixed single model</text>

  <rect x="284" y="188" width="200" height="56" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="384" y="210" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Call the router under test</text>
  <text x="384" y="230" font-size="11" fill="#64748b" text-anchor="middle">classify, then route</text>

  <rect x="150" y="270" width="240" height="56" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="270" y="292" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Record the result</text>
  <text x="270" y="312" font-size="11" fill="#64748b" text-anchor="middle">tokens, cost, latency, route taken</text>

  <rect x="150" y="354" width="240" height="56" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="270" y="376" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Blind pairwise judge</text>
  <text x="270" y="396" font-size="11" fill="#64748b" text-anchor="middle">both answers, random order</text>

  <rect x="220" y="438" width="100" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="270" y="461.4" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Next case</text>

  <rect x="180" y="536" width="180" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="270" y="559.4" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Generate the report</text>

  <!-- Layer 4: the loop back, painted last so no box and no panel wall can hide it where
       it crosses out of the panel at y=457.
       It leaves Next case at 220 - 5 = 215 and runs west at that box's mid height 457,
       then up a channel at x=22, 14px outside the panel wall.
       Two C segments joined at (22,421): the first arrives travelling north out of
       (22,457) and the second leaves north, so the tangent runs straight through the join.
       cp2 is (22,215), level with the end point, so the arrowhead lands pointing east; the
       tip reaches 31, 5px short of the panel's left wall at x=36. It terminates on the
       wall rather than on either call box because the next case re-enters the pair, not
       one of them.
       That east-pointing arm is only 3px (cp2 x=22 to end x=25) and cannot be widened: the
       channel is already near the left viewBox margin, and 11 of the 14px between it and
       the wall is owed to arrowhead clearance. If either endpoint is ever nudged, keep
       cp2.x < end.x or the arrowhead flips to point west. Dashed: the iteration is a
       state, drawn 6,4 like every state loop. -->
  <path d="M215,457 C 170,457 22,457 22,421 C 22,241 22,215 25,215" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <!-- Below the curve: its lowest run sits at y=457 and the glyph box reaches 7.5px above
       its own baseline, which keeps the 15px a curve label owes the line. -->
  <text x="118.5" y="483" font-size="10" fill="#94a3b8" text-anchor="middle">REPEAT</text>
</svg>
