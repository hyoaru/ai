<svg width="736" viewBox="0 0 736 582" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d-title">
  <title id="d-title">Where the lint gate sits</title>
  <desc>Agent writes candidate.svg, svg-lint reads and checks it and returns a receipt; while errors remain the agent patches one finding and re-lints, then freezes and hands over.</desc>
  <style>
    text { font-family: system-ui, sans-serif; }
  </style>
  <defs>
    <!-- Structural connector marker: hairline token -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#94a3b8"/>
    </marker>
    <!-- Accent marker: the lint gate's own exchanges -->
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#1d4ed8"/>
    </marker>
    <!-- Failure marker: the error cycle inside the alt frame -->
    <marker id="arrow-fail" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Ground -->
  <rect x="0" y="0" width="736" height="582" fill="#ffffff"/>

  <!-- Title block: content centre x=368, title baseline 40, subtitle title+24 -->
  <text x="368" y="40" font-size="24" font-weight="650" fill="#0f172a" text-anchor="middle">Where the lint gate sits</text>
  <text x="368" y="64" font-size="12.5" fill="#64748b" text-anchor="middle">Agent writes; svg-lint checks; errors loop back as repair hints</text>

  <!-- Alt frame: dashed because the conditional is state semantics, wrapping the
       two repair messages. Overhangs the participant row by 18px each side. -->
  <rect x="22" y="388" width="692" height="102" rx="10" fill="#eef1f5" stroke="#dbe1e8" stroke-dasharray="6,4"/>
  <text x="32" y="402" font-size="10" font-weight="600" fill="#94a3b8">alt [errors &gt; 0]</text>

  <!-- Lifelines: collinear vertical dashed guides, no arrowheads -->
  <path d="M140,131 L 140,557" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <path d="M368,131 L 368,557" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <path d="M596,131 L 596,557" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Messages: horizontal collinear lines; start = source lifeline + or - 5, line
       ends 11 short of the target lifeline so the painted tip stops 5px out.
       Message pitch 46px; each label rides 13px above its own arrow. -->
  <!-- 1. Agent to Filesystem -->
  <path d="M145,162 L 585,162" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 2. Agent to svg-lint -->
  <path d="M145,208 L 357,208" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <!-- 3. svg-lint to Filesystem: the gate reads the real file, not an intermediate IR -->
  <path d="M373,254 L 585,254" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 4. svg-lint self-call: out 5px clear at 373, bulge to 408, back to 379 =
       lifeline + 11; cp2.y = end.y keeps the closing tangent level -->
  <path d="M373,282 C 408,284 408,322 379,322" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <!-- 5. svg-lint back to Agent -->
  <path d="M363,362 L 151,362" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <!-- 6. Agent to Filesystem, inside alt: the failure path -->
  <path d="M145,428 L 585,428" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-fail)"/>
  <!-- 7. Agent to svg-lint, inside alt -->
  <path d="M145,474 L 357,474" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-fail)"/>
  <!-- 8. Agent self-call, starting 5px below the alt frame; same return shape as 4 -->
  <path d="M145,495 C 180,497 180,535 151,535" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Participant head cards; 200x38, baseline = 88 + 19 + 12.5 x 0.35 -->
  <rect x="40" y="88" width="200" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="140" y="111.4" font-size="12.5" fill="#0f172a" text-anchor="middle">Agent</text>
  <rect x="268" y="88" width="200" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="368" y="111.4" font-size="12.5" fill="#0f172a" text-anchor="middle">svg-lint</text>
  <rect x="496" y="88" width="200" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="596" y="111.4" font-size="12.5" fill="#0f172a" text-anchor="middle">Filesystem</text>

  <!-- Message labels, each in a clear channel between two adjacent lifelines -->
  <text x="482" y="149" font-size="10" fill="#64748b" text-anchor="middle">write candidate.svg</text>
  <text x="254" y="195" font-size="10" fill="#1d4ed8" text-anchor="middle">lint candidate.svg --json</text>
  <text x="482" y="241" font-size="10" fill="#64748b" text-anchor="middle">read</text>
  <!-- Note on the read message, below its arrow, muted italic, so it does not read
       as a message label of its own -->
  <text x="495" y="275" font-size="11" fill="#94a3b8" font-style="italic" text-anchor="middle">the finished file, not an IR</text>
  <text x="420" y="310" font-size="10" fill="#1d4ed8">run 12 checks</text>
  <text x="254" y="349" font-size="10" fill="#1d4ed8" text-anchor="middle">receipt: errors + repair hints</text>
  <text x="482" y="415" font-size="10" fill="#dc2626" text-anchor="middle">patch one finding</text>
  <text x="254" y="461" font-size="10" fill="#dc2626" text-anchor="middle">re-lint</text>
  <text x="192" y="523" font-size="10" fill="#64748b">freeze and hand over</text>
</svg>
