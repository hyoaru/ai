<svg viewBox="0 0 764 672" width="764" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d09-title">
  <title id="d09-title">Tiered model routing behind one gateway</title>
  <desc>A request enters a three-step router pipeline. The first matching rule sends it to one of three model tiers, and all three tiers converge on a single LLM gateway with a fallback chain per tier.</desc>
  <style>
    text { font-family: system-ui, sans-serif; }
  </style>
  <defs>
    <!-- Structural arrow: hairline token. markerUnits="userSpaceOnUse" is mandatory. -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#94a3b8"/>
    </marker>
    <!-- Accent arrow: the one story-carrying flow, the routing decision chain. -->
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- Ground: white canvas behind everything -->
  <rect x="0" y="0" width="764" height="672" fill="#ffffff"/>

  <!-- Column and row arithmetic, decided before any coordinate was written.
       Every card is 208 wide: the widest 11px secondary line is 30 chars x 6.0 = 180,
       leaving 14px of padding each side. Card centres 146 / 382 / 618.
       Tier row: three 208px cards on a 236px pitch, both gaps 28px; the tiers panel adds
       20px side padding, so it spans x 22..742 and the content centre is 382.
       Vertical rhythm: panels hold a 20px title band, then cards on 28px gaps, then a
       30px bottom pad. Panels sit 30px apart; the gateway card 25px below the tiers panel.
       viewBox: content runs x 22..742 and y 22 (title glyph top) .. 647 (gateway bottom),
       so 22px on top/left/right and 25px at the bottom: 0 0 764 672. -->

  <!-- Title on the content centre 382. Baseline 40 = 22px top margin + 24 x 0.75 ascent;
       subtitle baseline = title + 24. -->
  <text x="382" y="40" font-size="24" font-weight="650" fill="#0f172a" text-anchor="middle">Tiered model routing behind one gateway</text>
  <text x="382" y="64" font-size="12.5" fill="#64748b" text-anchor="middle">first matching rule picks a tier; one gateway serves them all</text>

  <!-- Layer 1: grouping panels, painted before the connectors they channel.
       Router panel: x 258..506, y 84..394. Label left-aligned to the inner card column
       (x 278), baseline panel top + 20; first card top 120. -->
  <rect x="258" y="84" width="248" height="310" rx="12" fill="#eef1f5" stroke="#dbe1e8"/>
  <text x="278" y="104" font-size="10" font-weight="600" letter-spacing="0.5" fill="#94a3b8">ROUTER</text>

  <!-- Tiers panel: x 22..742, y 424..566. Label x 42; tier cards start y 460. -->
  <rect x="22" y="424" width="720" height="142" rx="12" fill="#eef1f5" stroke="#dbe1e8"/>
  <text x="42" y="444" font-size="10" font-weight="600" letter-spacing="0.5" fill="#94a3b8">MODEL TIERS</text>

  <!-- Layer 2: connectors. Vertical runs: start = source bottom + 5, end = target top - 11,
       so the 6px arrowhead tip stops 5px short of the target. Visible line 12px.
       Accent carries the one story: the routing decision chain from request to tier.
       The convergence drops into the gateway are structural hairline. -->
  <path d="M382,181 L 382,193" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M382,285 L 382,297" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M382,369 L 382,449" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <!-- The two outer fan-out legs leave the sides of the rule box rather than its bottom
       edge, so every point of each curve stays outside the middle tier's own x span.
       Start x = 278 - 5 and 486 + 5, both at the rule box mid height 308 + 56/2 = 336.
       cp2 shares x with the end point and sits above it, so the arrowhead lands plumb:
       end y = 460 - 11 = 449, tip reaches 455, 5px short of the tier row.
       Mirrored about x=382: both legs reach 119px sideways. -->
  <path d="M273,336 C 200,336 146,380 146,449" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M491,336 C 564,336 618,380 618,449" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <!-- Convergence: three collinear drops from 536 + 5 to 591 - 11 at the tier centres
       146, 382 and 618. Hairline: the gateway is shared infrastructure, not a decision. -->
  <path d="M146,541 L 146,580" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M382,541 L 382,580" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M618,541 L 618,580" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 3: cards. White fill, 1px border, radius 6. Baselines: two-line cards put the
       pair at box top + 22 / + 42 (block midpoint = centre + 0.35 x mean font size);
       three-line cards keep the two 11px secondaries 16.5px apart (11 x 1.5) at
       top + 23.5 / + 44 / + 60.5. Tier meaning lives in the zone title, not in card colour. -->
  <rect x="278" y="120" width="208" height="56" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="382" y="142" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Incoming request</text>
  <text x="382" y="162" font-size="11" fill="#64748b" text-anchor="middle">any model may be requested</text>

  <rect x="278" y="204" width="208" height="76" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="382" y="227.5" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Feature extraction</text>
  <text x="382" y="248" font-size="11" fill="#64748b" text-anchor="middle">token count · tools requested</text>
  <text x="382" y="264.5" font-size="11" fill="#64748b" text-anchor="middle">context depth · task type</text>

  <rect x="278" y="308" width="208" height="56" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="382" y="330" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Rule match</text>
  <text x="382" y="350" font-size="11" fill="#64748b" text-anchor="middle">first matching rule wins</text>

  <rect x="42" y="460" width="208" height="76" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="146" y="483.5" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Tier 1 · Light</text>
  <text x="146" y="504" font-size="11" fill="#64748b" text-anchor="middle">short follow-ups, translation</text>
  <text x="146" y="520.5" font-size="11" fill="#64748b" text-anchor="middle">a small fast model</text>

  <rect x="278" y="460" width="208" height="76" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="382" y="483.5" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Tier 2 · Standard</text>
  <text x="382" y="504" font-size="11" fill="#64748b" text-anchor="middle">anything no other rule matched</text>
  <text x="382" y="520.5" font-size="11" fill="#64748b" text-anchor="middle">a mid-tier model</text>

  <rect x="514" y="460" width="208" height="76" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="618" y="483.5" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Tier 3 · Advanced</text>
  <text x="618" y="504" font-size="11" fill="#64748b" text-anchor="middle">complex reasoning, design work</text>
  <text x="618" y="520.5" font-size="11" fill="#64748b" text-anchor="middle">a frontier model</text>

  <!-- The base bar spans the whole tier row, 22..742, so the convergence reads as three
       paths entering one component. Emphasised card: border-strong token. -->
  <rect x="22" y="591" width="720" height="56" rx="6" fill="#ffffff" stroke="#c3ccd8"/>
  <text x="382" y="613" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">LLM gateway</text>
  <text x="382" y="633" font-size="11" fill="#64748b" text-anchor="middle">single endpoint, fallback chain per tier</text>
</svg>
