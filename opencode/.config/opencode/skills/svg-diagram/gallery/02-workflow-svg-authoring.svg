<svg width="443" viewBox="183 0 443 476" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d-title">
  <title id="d-title">The authoring loop</title>
  <desc>Read the request, compute layout numbers, emit SVG, run svg-lint; a clean verdict delivers, otherwise one repair hint is applied and the gate re-lints.</desc>
  <style>
    text { font-family: system-ui, sans-serif; }
  </style>
  <defs>
    <!-- Structural connector marker: hairline token -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#94a3b8"/>
    </marker>
    <!-- Accent marker: the one passing verdict, gate to delivery -->
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#1d4ed8"/>
    </marker>
    <!-- Failure marker: the rejected verdict and the repair loop -->
    <marker id="arrow-fail" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Ground; viewBox origin 183 keeps 22px margins around content x=205..604 -->
  <rect x="183" y="0" width="443" height="476" fill="#ffffff"/>

  <!-- Title block: content centre x=404.5, title baseline 40, subtitle title+24 -->
  <text x="404.5" y="40" font-size="24" font-weight="650" fill="#0f172a" text-anchor="middle">The authoring loop</text>
  <text x="404.5" y="64" font-size="12.5" fill="#64748b" text-anchor="middle">Draft, emit, lint and repair until the gate passes</text>

  <!-- Main column: x=205..395, centre 300; six 38px cards at a 65px pitch (27px gaps).
       Baselines: box y + 19 + 12.5 x 0.35 -->
  <!-- Ordinary connectors: start = bottom edge + 5, line ends 11 short of the next card -->
  <path d="M300,131 L 300,142" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M300,196 L 300,207" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M300,261 L 300,272" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M300,326 L 300,337" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Passing verdict: the one accent edge -->
  <path d="M300,391 L 300,402" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <!-- Failure branch: decision right edge 395 to repair left edge 424 -->
  <path d="M400,367 L 413,367" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-fail)"/>

  <!-- Cards -->
  <rect x="205" y="88" width="190" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="300" y="111.4" font-size="12.5" fill="#0f172a" text-anchor="middle">Read the request</text>
  <rect x="205" y="153" width="190" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="300" y="176.4" font-size="12.5" fill="#0f172a" text-anchor="middle">Compute layout numbers</text>
  <rect x="205" y="218" width="190" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="300" y="241.4" font-size="12.5" fill="#0f172a" text-anchor="middle">Emit SVG</text>
  <rect x="205" y="283" width="190" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="300" y="306.4" font-size="12.5" fill="#0f172a" text-anchor="middle">svg-lint</text>
  <!-- Decision node: the gate, emphasized with the border-strong token -->
  <rect x="205" y="348" width="190" height="38" rx="6" fill="#ffffff" stroke="#c3ccd8"/>
  <text x="300" y="371.4" font-size="12.5" fill="#0f172a" text-anchor="middle">0 errors, 0 warnings?</text>
  <rect x="205" y="413" width="190" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="300" y="436.4" font-size="12.5" fill="#0f172a" text-anchor="middle">Deliver — frozen</text>
  <!-- Failure branch target -->
  <rect x="424" y="348" width="180" height="38" rx="6" fill="#ffffff" stroke="#d8dee6"/>
  <text x="514" y="371.4" font-size="12.5" fill="#0f172a" text-anchor="middle">Apply one repair hint</text>

  <!-- Branch labels: "no" sits just above the box tops so its glyph box clears
       both cards; "yes" hangs 12px right of its arrow, mid-run -->
  <text x="409.5" y="344" font-size="10" fill="#dc2626" text-anchor="middle">no</text>
  <text x="312" y="400" font-size="10" fill="#1d4ed8">yes</text>

  <!-- Side notes for the two steps that happen before any SVG exists -->
  <text x="410" y="111" font-size="11" fill="#64748b">subject, nodes, connectors</text>
  <text x="410" y="165" font-size="11" fill="#64748b">height = 3 × font-size</text>
  <text x="410" y="180" font-size="11" fill="#64748b">spacing 25-30px</text>

  <!-- Failure loop back, painted last so no card hides it. Dashed because the loop
       is true state semantics. cp2.y = end.y and cp2.x > end.x, so the head lands
       pointing left into the Emit SVG card. -->
  <path d="M514,343 C 514,290 514,237 406,237" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-fail)"/>
  <text x="532" y="293" font-size="10" fill="#dc2626">re-lint</text>
</svg>
