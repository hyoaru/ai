<svg width="716" height="207.5" viewBox="0 0 716 207.5" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d05-title">
  <title id="d05-title">The life of a skill in this repo</title>
  <desc>Five states left to right: Draft, Dogfooded, Linted, Published, Deprecated. Solid arrows carry the forward transitions; a dashed loop returns Published to Draft for revision.</desc>
  <style>
    text { font-family: system-ui, sans-serif; }
  </style>
  <defs>
    <!-- Accent arrow: the lifecycle is the one story-carrying flow here -->
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="716" height="207.5" fill="#ffffff"/>

  <!-- Title centred on the row of states (22..694), not the viewBox -->
  <text x="358" y="40" font-size="24" font-weight="650" fill="#0f172a" text-anchor="middle">The life of a skill in this repo</text>

  <!-- One row of states: five 112x38 pills (rx=18 reads as state, not part) at a 140px pitch.
       Row top y=80, bottom y=118, mid y=99. Baseline = 80 + 19 + 12.5x0.35 = 103.4.
       Deprecated alone takes the failure token: a dead end, not a category colour. -->
  <rect x="22" y="80" width="112" height="38" rx="18" fill="#ffffff" stroke="#d8dee6"/>
  <text x="78" y="103.4" font-size="12.5" fill="#0f172a" text-anchor="middle">Draft</text>
  <rect x="162" y="80" width="112" height="38" rx="18" fill="#ffffff" stroke="#d8dee6"/>
  <text x="218" y="103.4" font-size="12.5" fill="#0f172a" text-anchor="middle">Dogfooded</text>
  <rect x="302" y="80" width="112" height="38" rx="18" fill="#ffffff" stroke="#d8dee6"/>
  <text x="358" y="103.4" font-size="12.5" fill="#0f172a" text-anchor="middle">Linted</text>
  <rect x="442" y="80" width="112" height="38" rx="18" fill="#ffffff" stroke="#d8dee6"/>
  <text x="498" y="103.4" font-size="12.5" fill="#0f172a" text-anchor="middle">Published</text>
  <rect x="582" y="80" width="112" height="38" rx="18" fill="#ffffff" stroke="#dc2626"/>
  <text x="638" y="103.4" font-size="12.5" fill="#dc2626" text-anchor="middle">Deprecated</text>

  <!-- Forward transitions, collinear at the row's mid height: start = source right + 5, end = target left - 11.
       State semantics, so the dashed loop below keeps its dash. -->
  <path d="M139,99 L 151,99" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M279,99 L 291,99" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M419,99 L 431,99" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <path d="M559,99 L 571,99" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <!-- Transition names, 10px uppercase, lifted clear of the row band (ink 62.5..72.5, boxes start 80).
       Each name belongs to the arrow directly beneath it. -->
  <text x="148" y="70" font-size="10" letter-spacing="0.5" fill="#94a3b8" text-anchor="middle">USED ON A REAL TASK</text>
  <text x="288" y="70" font-size="10" letter-spacing="0.5" fill="#94a3b8" text-anchor="middle">0 ERRORS, 0 WARNINGS</text>
  <text x="428" y="70" font-size="10" letter-spacing="0.5" fill="#94a3b8" text-anchor="middle">MERGED</text>
  <text x="568" y="70" font-size="10" letter-spacing="0.5" fill="#94a3b8" text-anchor="middle">SUPERSEDED</text>

  <!-- Revision loop, painted last so no state box hides it. Leaves Published's bottom (118+5),
       runs west at y=156, 38px below the row, and re-enters Draft's bottom at 118+11.
       Join at (220,156) is tangent-continuous: both segments travel west through it.
       Last control point (78,156) shares the end point's x, so the head lands plumb, pointing up.
       Dashed: state semantics, the one dashed stroke allowed here. -->
  <path d="M498,123 C 498,156 300,156 220,156 C 160,156 78,156 78,129" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-accent)"/>
  <!-- Below the curve: glyph top 172.5 clears the loop's lowest sampled point (about 155.6) by 17px -->
  <text x="288" y="180" font-size="10" letter-spacing="0.5" fill="#94a3b8" text-anchor="middle">REVISION</text>
</svg>
